<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#103d32"><title>ROHNY | لوحة الإدارة</title>
<style>
:root{color-scheme:dark;--bg:#071b17;--panel:#102b25;--line:#24483f;--green:#35d39a;--muted:#9bb8ae;--danger:#ff8f8f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#174a3c 0,transparent 38%),var(--bg);color:#f3fbf7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1200px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-size:24px;font-weight:800}.brand span{color:var(--green)}.sub{color:var(--muted);font-size:14px;margin-top:4px}
.panel,.stat{background:rgba(16,43,37,.92);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 30px #0002}.login{max-width:440px;margin:8vh auto}.field{display:block;margin:14px 0;color:var(--muted);font-size:14px}input{display:block;width:100%;margin-top:7px;border:1px solid var(--line);border-radius:10px;background:#071b17;color:white;padding:13px;font:inherit}button{border:0;border-radius:11px;padding:12px 17px;background:var(--green);color:#06251b;font-weight:800;font:inherit;cursor:pointer}button.secondary{background:#23483e;color:#f3fbf7}button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}.msg{min-height:24px;color:var(--muted);font-size:14px;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat strong{display:block;font-size:26px;margin-top:7px}.stat span{color:var(--muted);font-size:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:right;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--muted);font-weight:600}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#57451b;color:#ffe2a0;font-size:12px}.error{color:var(--danger)}.actions{display:flex;gap:8px;align-items:center}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:650px){main{padding:14px}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.panel{padding:14px}}
</style></head>
<body><main>
<header class="top"><div><div class="brand">ROHNY <span>روحني</span></div><div class="sub">لوحة متابعة الرحلات — الإدارة</div></div><div id="headerActions" class="actions hidden"><button class="secondary" id="refreshBtn">تحديث الرحلات</button><button class="secondary" id="logoutBtn">تسجيل الخروج</button></div></header>
<section id="loginPanel" class="panel login"><h2>تسجيل دخول الإدارة</h2><p class="sub">استخدم حسابًا مُفعّلًا بصلاحية admin.</p><form id="loginForm"><label class="field">البريد الإلكتروني<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label class="field">كلمة المرور<input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><button id="loginBtn" type="submit">دخول لوحة الإدارة</button><div id="loginMsg" class="msg" role="status"></div></form></section>
<section id="dashboard" class="hidden"><div class="stats"><div class="stat"><span>إجمالي الرحلات المعروضة</span><strong id="total">—</strong></div><div class="stat"><span>قيد الانتظار</span><strong id="pending">—</strong></div><div class="stat"><span>حالات أخرى</span><strong id="other">—</strong></div></div><section class="panel"><div class="top"><div><h2 style="margin:0">الرحلات</h2><div class="sub">عرض للمتابعة فقط — لا يتم تغيير حالات الرحلات من هذه النسخة.</div></div><div class="sub" id="lastUpdated"></div></div><div class="tablewrap"><table><thead><tr><th>رقم الرحلة</th><th>الانطلاق</th><th>الوجهة</th><th>النوع</th><th>الدفع</th><th>الحالة</th><th>وقت الطلب</th></tr></thead><tbody id="tripRows"><tr><td colspan="7" class="empty">جارٍ تحميل الرحلات…</td></tr></tbody></table></div><div id="dashMsg" class="msg" role="status"></div></section></section>
</main>
<script>
const API_BASE='';
const $=id=>document.getElementById(id);
let token=null;
function safe(value){return String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function when(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ar-EG');}
async function request(path,options={}){const response=await fetch(API_BASE+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})}});const body=await response.json().catch(()=>({message:'استجابة غير مفهومة'}));if(!response.ok)throw new Error(body.message||'تعذر إكمال الطلب');return body;}
function showLogin(message='',isError=false){$('loginPanel').classList.remove('hidden');$('dashboard').classList.add('hidden');$('headerActions').classList.add('hidden');$('loginMsg').textContent=message;$('loginMsg').classList.toggle('error',isError);}
async function loadTrips(){ $('dashMsg').textContent='جارٍ تحميل الرحلات…';try{const trips=await request('/admin/trips');const rows=Array.isArray(trips)?trips:[];$('total').textContent=rows.length;$('pending').textContent=rows.filter(t=>t.status==='pending').length;$('other').textContent=rows.filter(t=>t.status!=='pending').length;$('tripRows').innerHTML=rows.length?rows.map(t=>'<tr><td dir="ltr">'+safe(t.id)+'</td><td>'+safe(t.pickupAddress)+'</td><td>'+safe(t.destinationAddress)+'</td><td>'+safe(t.rideType)+'</td><td>'+safe(t.paymentMethod)+'</td><td><span class="pill">'+safe(t.status)+'</span></td><td>'+safe(when(t.createdAt))+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">لا توجد رحلات حتى الآن.</td></tr>';$('lastUpdated').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG');$('dashMsg').textContent='';}catch(e){$('dashMsg').textContent=e.message;$('dashMsg').classList.add('error');if(/token|unauthorized|expired/i.test(e.message)) {token=null;showLogin('انتهت الجلسة أو يلزم تسجيل الدخول مرة أخرى.',true);}}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginMsg').textContent='جارٍ التحقق من الحساب…';$('loginMsg').classList.remove('error');try{const data=await request('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});if(data.user?.role!=='admin')throw new Error('هذا الحساب ليس حساب إدارة. يلزم حساب بصلاحية admin.');token=data.accessToken;$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('headerActions').classList.remove('hidden');await loadTrips();}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').classList.add('error');}finally{$('loginBtn').disabled=false;}});
$('refreshBtn').addEventListener('click',loadTrips);$('logoutBtn').addEventListener('click',()=>{token=null;showLogin('تم تسجيل الخروج.');$('password').value='';});
</script></body></html>
