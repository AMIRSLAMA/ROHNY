name: ROHNY backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "apps/rider/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check rider booking JavaScript syntax
        run: node --check ../apps/rider/booking-api.js

      - name: Install locked dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Install temporary test runner
        run: npm install --no-save jest ts-jest @types/jest

      - name: Run backend unit tests
        run: npx jest --runInBand --transform='{"^.+\\.tsx?$":"ts-jest"}'
