name: ROHNY backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "apps/rider/**"
      - "apps/admin/**"
      - "apps/preview-server.cjs"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rohny_test
          POSTGRES_PASSWORD: rohny_test_password
          POSTGRES_DB: rohny_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rohny_test -d rohny_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: rohny_test
      DB_PASSWORD: rohny_test_password
      DB_DATABASE: rohny_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check rider booking JavaScript syntax
        run: node --check ../apps/rider/booking-api.js

      - name: Check preview server JavaScript syntax
        run: node --check ../apps/preview-server.cjs

      - name: Check driver dashboard JavaScript syntax
        run: node --check ../apps/driver/driver.js


      - name: Check inline rider and admin JavaScript syntax
        run: >-
          node -e "const fs=require('fs');
          for (const f of ['../apps/rider/index.html','../apps/admin/index.html']) {
            const html=fs.readFileSync(f,'utf8');
            for (const m of html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)) new Function(m[1]);
            console.log(f + ': inline scripts OK');
          }"

      - name: Install locked dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Apply all migrations to a disposable PostgreSQL database
        run: npm run migration:run

      - name: Verify wallet schema and platform account
        run: node scripts/verify-wallet-schema.cjs

      - name: Install temporary test runner
        run: npm install --no-save jest ts-jest @types/jest

      - name: Run backend unit tests
        run: npx jest --runInBand --transform='{"^.+\\.tsx?$":"ts-jest"}'
